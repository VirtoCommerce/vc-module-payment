<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Payment">
  <title>Payment</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#FFC24D"/>
      <stop offset="100%" stop-color="#ED8A12"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#7A3D00" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <g transform="translate(64,64)" filter="url(#lift)">
    <!-- Back card -->
    <rect x="-34" y="-34" width="76" height="52" rx="8" fill="#9D86F5"/>
    <!-- Front card -->
    <rect x="-44" y="-22" width="82" height="54" rx="8" fill="#2F6BD6"/>
    <!-- Chip -->
    <rect x="-34" y="-9" width="17" height="13" rx="3" fill="#FFD24D"/>
    <line x1="-25.5" y1="-9" x2="-25.5" y2="4" stroke="#C98A1E" stroke-width="1.6"/>
    <line x1="-34" y1="-2.5" x2="-17" y2="-2.5" stroke="#C98A1E" stroke-width="1.6"/>
    <!-- Contactless -->
    <path d="M5,-10 a9,9 0 0 1 0,18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M13,-15 a15,15 0 0 1 0,28" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- Number -->
    <line x1="-34" y1="18" x2="20" y2="18" stroke="#BFD6F2" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
